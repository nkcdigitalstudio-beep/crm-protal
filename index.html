<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaviyaa Group — Multi-Portal Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: linear-gradient(
          135deg,
          #e8f0fc 0%,
          #f4f7fc 50%,
          #e1ecfb 100%
        );
      }
      @keyframes popIn {
        0% {
          opacity: 0;
          transform: translateY(-8px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-pop {
        animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden bg-cover bg-center bg-no-repeat"
    style="
      background-image:
        linear-gradient(rgba(14, 30, 54, 0.58), rgba(14, 30, 54, 0.72)),
        url(&quot;https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80&quot;);
    "
  >
    <!-- Top Brand Header -->
    <div class="relative z-10 text-center mb-5">
      <div
        class="inline-flex items-center gap-2.5 bg-white/90 backdrop-blur-md border border-white/40 px-4 py-1.5 rounded-full shadow-lg mb-2"
      >
        <span class="text-sm">✈️</span>
        <span class="text-xs font-bold tracking-wider text-slate-800 uppercase"
          >Kavya Groups • Travel & Tours CRM</span
        >
      </div>
    </div>

    <div
      class="fixed -top-32 -left-32 w-[450px] h-[450px] bg-blue-200/30 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="fixed -bottom-32 -right-32 w-[450px] h-[450px] bg-indigo-200/30 rounded-full blur-3xl pointer-events-none"
    ></div>

    <div class="relative z-10 w-full max-w-[430px] flex flex-col items-center">
      <!-- Top Floating Pill Tabs: CRM -> Admin -> Telecalling -->
      <div
        class="bg-white/95 backdrop-blur-md p-1.5 rounded-full shadow-[0_8px_25px_rgba(15,23,42,0.06)] border border-slate-200/70 grid grid-cols-3 w-full max-w-[350px] mb-4"
      >
        <button
          type="button"
          id="tab-crm"
          onclick="selectPortal('CRM')"
          class="py-2 px-4 text-xs font-bold rounded-full bg-[#1D6CE0] text-white shadow-sm transition-all duration-200"
        >
          CRM
        </button>
        <button
          type="button"
          id="tab-admin"
          onclick="selectPortal('Admin')"
          class="py-2 px-4 text-xs font-semibold rounded-full text-slate-600 hover:text-slate-900 transition-all duration-200"
        >
          Admin
        </button>
        <button
          type="button"
          id="tab-telecalling"
          onclick="selectPortal('Telecalling')"
          class="py-2 px-4 text-xs font-semibold rounded-full text-slate-600 hover:text-slate-900 transition-all duration-200"
        >
          Telecalling
        </button>
      </div>

      <!-- Telecalling Sub-Role Pop-up Selector -->
      <div
        id="telecalling-popup"
        class="hidden w-full max-w-[320px] mb-4 animate-pop"
      >
        <div
          class="bg-white rounded-2xl p-2 shadow-[0_10px_30px_rgba(29,108,224,0.15)] border border-blue-100"
        >
          <p
            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 text-center mb-1.5"
          >
            Select Telecalling Role
          </p>
          <div class="grid grid-cols-2 gap-1.5">
            <button
              type="button"
              id="role-manager"
              onclick="selectSubRole('Manager')"
              class="py-2 px-3 text-xs font-bold rounded-xl bg-[#1D6CE0] text-white shadow-sm transition"
            >
              Manager
            </button>
            <button
              type="button"
              id="role-executive"
              onclick="selectSubRole('Executive')"
              class="py-2 px-3 text-xs font-semibold rounded-xl bg-slate-50 text-slate-600 hover:bg-blue-50 hover:text-[#1D6CE0] transition"
            >
              Executive
            </button>
          </div>
        </div>
      </div>

      <!-- Main White Login Card -->
      <div
        class="w-full bg-white rounded-[24px] shadow-[0_20px_50px_rgba(15,23,42,0.07)] border border-slate-100 p-7 sm:p-9"
      >
        <div class="text-center mb-6">
          <h1
            class="text-xl sm:text-[22px] font-extrabold text-slate-900 tracking-tight"
          >
            Welcome to Multi-Portal Access
          </h1>
          <p class="text-xs text-slate-500 mt-1.5">
            Select your portal and enter details below
          </p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5"
              >User ID</label
            >
            <div
              class="flex items-center bg-[#F1F5F9] border border-slate-200/80 rounded-xl px-3.5 py-3 focus-within:bg-white focus-within:border-[#1D6CE0] focus-within:ring-4 focus-within:ring-blue-500/10 transition"
            >
              <svg
                class="w-4 h-4 text-slate-400 mr-2.5 shrink-0"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
                />
              </svg>
              <input
                id="user-id"
                type="text"
                required
                placeholder="Enter your CRM User ID"
                class="w-full bg-transparent text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5"
              >Password</label
            >
            <div
              class="flex items-center bg-white border border-slate-200 rounded-xl px-3.5 py-3 focus-within:border-[#1D6CE0] focus-within:ring-4 focus-within:ring-blue-500/10 transition"
            >
              <svg
                class="w-4 h-4 text-slate-400 mr-2.5 shrink-0"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
                />
              </svg>
              <input
                id="user-pass"
                type="password"
                required
                placeholder="••••••••••••"
                class="w-full bg-transparent text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none pr-2"
              />
              <button
                type="button"
                onclick="togglePassword()"
                class="text-slate-400 hover:text-slate-600 focus:outline-none"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full bg-[#1D6CE0] hover:bg-[#155BB5] text-white font-bold text-xs sm:text-sm py-3.5 rounded-xl shadow-[0_8px_20px_rgba(29,108,224,0.28)] transition mt-2"
          >
            Login to CRM
          </button>
        </form>

        <div class="text-center mt-5 space-y-2 text-[11px]">
          <div>
            <a
              href="#"
              onclick="return false;"
              class="text-[#1D6CE0] font-semibold hover:underline"
              >Forgot Password?</a
            >
          </div>
          <p class="text-slate-400">
            Need Help?
            <a
              href="#"
              onclick="return false;"
              class="text-slate-600 font-semibold hover:underline"
              >Contact Support</a
            >
          </p>
        </div>
      </div>
    </div>

    <script>
      let activePortal = "CRM";
      let activeSubRole = "Manager";

      function selectPortal(portal) {
        activePortal = portal;

        const tabs = {
          CRM: document.getElementById("tab-crm"),
          Admin: document.getElementById("tab-admin"),
          Telecalling: document.getElementById("tab-telecalling"),
        };

        Object.keys(tabs).forEach((key) => {
          if (key === portal) {
            tabs[key].className =
              "py-2 px-4 text-xs font-bold rounded-full bg-[#1D6CE0] text-white shadow-sm transition-all duration-200";
          } else {
            tabs[key].className =
              "py-2 px-4 text-xs font-semibold rounded-full text-slate-600 hover:text-slate-900 transition-all duration-200";
          }
        });

        const popup = document.getElementById("telecalling-popup");
        if (portal === "Telecalling") {
          popup.classList.remove("hidden");
        } else {
          popup.classList.add("hidden");
        }

        updateFormUI();
      }

      function selectSubRole(role) {
        activeSubRole = role;
        const mgrBtn = document.getElementById("role-manager");
        const execBtn = document.getElementById("role-executive");

        if (role === "Manager") {
          mgrBtn.className =
            "py-2 px-3 text-xs font-bold rounded-xl bg-[#1D6CE0] text-white shadow-sm transition";
          execBtn.className =
            "py-2 px-3 text-xs font-semibold rounded-xl bg-slate-50 text-slate-600 hover:bg-blue-50 hover:text-[#1D6CE0] transition";
        } else {
          execBtn.className =
            "py-2 px-3 text-xs font-bold rounded-xl bg-[#1D6CE0] text-white shadow-sm transition";
          mgrBtn.className =
            "py-2 px-3 text-xs font-semibold rounded-xl bg-slate-50 text-slate-600 hover:bg-blue-50 hover:text-[#1D6CE0] transition";
        }

        updateFormUI();
      }

      function updateFormUI() {
        const btn = document.getElementById("submit-btn");
        const userInput = document.getElementById("user-id");

        if (activePortal === "CRM") {
          btn.textContent = "Login to CRM";
          userInput.placeholder = "Enter your CRM User ID";
        } else if (activePortal === "Admin") {
          btn.textContent = "Login to Admin";
          userInput.placeholder = "Enter your Admin ID";
        } else {
          btn.textContent = `Login as Telecalling ${activeSubRole}`;
          userInput.placeholder = `Enter ${activeSubRole} User ID`;
        }
      }

      function togglePassword() {
        const pwd = document.getElementById("user-pass");
        pwd.type = pwd.type === "password" ? "text" : "password";
      }

      function handleLogin(e) {
        e.preventDefault();
        if (activePortal === "CRM") {
          window.location.href = "crm-dashboard.html";
        } else if (activePortal === "Admin") {
          window.location.href = "admin-dashboard.html";
        } else if (activeSubRole === "Manager") {
          window.location.href = "manager-dashboard.html";
        } else {
          window.location.href = "sales-dashboard.html";
        }
      }
    </script>
  </body>
</html>
